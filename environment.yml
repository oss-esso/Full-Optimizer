# OQI Project - VRP Optimization Environment (Conda)
# To create: conda env create -f environment.yml
# To update: conda env update -f environment.yml --prune

name: oqi_vrp

channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11

  # Core scientific computing
  - numpy=1.24.*
  - scipy=1.10.*
  - pandas=2.0.*

  # Optimization libraries
  - ortools=9.5.*
  - pulp=2.7.*
  - networkx=3.0.*

  # Visualization
  - matplotlib=3.7.*
  - seaborn=0.12.*
  - plotly=5.15.*
  - folium=0.14.*

  # Excel and data I/O
  - openpyxl=3.1.*
  - xlrd=2.0.*

  # Geographic libraries
  - geopandas=0.13.*
  - shapely=2.0.*
  - geopy=2.3.*

  # Web and requests
  - requests=2.31.*

  # Jupyter ecosystem
  - jupyter=1.0.*
  - jupyterlab=4.0.*
  - notebook=6.5.*
  - ipywidgets=8.0.*

  # Machine learning
  - scikit-learn=1.3.*

  # Database
  - sqlalchemy=2.0.*
  - sqlite=3.42.*

  # Development tools
  - pytest=7.4.*
  - black=23.7.*

  # System utilities
  - psutil=5.9.*

  # Parallel processing
  - joblib=1.3.*

  # Image processing
  - pillow=10.0.*

  # Additional pip packages
  - pip=23.2.*
  - pip:
    # PDF and QR code generation
    - fpdf2>=2.8.0
    - qrcode[pil]>=8.2
    
    # Enhanced visualization
    - kaleido>=0.2.1
    
    # Progress and logging
    - tqdm>=4.66.0
    - colorlog>=6.7.0
    
    # Configuration
    - python-dotenv>=1.0.0
    
    # Data structures
    - dataclasses-json>=0.6.0
    
    # Time utilities
    - pytz>=2023.3
    - arrow>=1.2.3
    
    # Performance profiling
    - memory-profiler>=0.61.0
    
    # Additional optimization
    - pymoo>=0.6.0
    
    # Enhanced JSON
    - ujson>=5.8.0
    
    # Web framework
    - fastapi>=0.103.0
    - uvicorn>=0.23.0
    
    # Statistics
    - pingouin>=0.5.3
    
    # CLI tools
    - click>=8.1.0
    - rich>=13.5.0
    
    # Text processing
    - fuzzywuzzy>=0.18.0
    - python-levenshtein>=0.21.0
